{{ with index site.Data.audio (printf "%d" .Weight) }}
<div class="chapter-audio" id="listen" data-revision="{{ .revision }}">
  <button type="button" id="btn-narration" aria-pressed="false" aria-label="收听本章" title="guige 声音 · AI 朗读 · {{ .duration }}">收听</button>
  <audio id="chapter-narration" preload="none" hidden src="{{ .mixed | relURL }}"></audio>
</div>
{{ end }}
