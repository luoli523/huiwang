{{ with index site.Data.audio (printf "%d" .Weight) }}
<div class="chapter-audio" id="listen" data-revision="{{ .revision }}">
  <button type="button" id="btn-narration" aria-pressed="false" aria-label="播放本章" title="guige 声音 · AI 朗读 · {{ .duration }}">播放</button>
  <input id="narration-progress" type="range" min="0" max="{{ .seconds }}" step="0.1" value="0" aria-label="收听进度" aria-valuetext="尚未播放" title="拖动调整收听进度">
  <span class="chapter-audio__time" id="narration-time">0:00 / {{ .duration }}</span>
  <audio id="chapter-narration" preload="none" hidden src="{{ .mixed | relURL }}"></audio>
</div>
{{ end }}
